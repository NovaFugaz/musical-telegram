spring.application.name=catalog-service
server.port=${SERVER_PORT:8082}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db}
spring.datasource.username=${POSTGRES_USER:bexai}
spring.datasource.password=${POSTGRES_PASSWORD:bexai123}

# JWT (mismo secret que auth-service)
jwt.secret=${JWT_SECRET:3ht7t87MNVRRAmDBBVXkOXBu8I4A4bafN6cB9vQKl0x}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Datos sintéticos (src/main/resources/data.sql)
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info
