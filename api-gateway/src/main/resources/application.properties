spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[3].id=report-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://report-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/report/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2
