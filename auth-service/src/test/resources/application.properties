spring.application.name=auth-service
server.port=8081

eureka.client.enabled=false

#Temporal, tengo que cambiarla por postgresql después
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

jwt.secret=EstaEsUnaClaveSecretaSuperLargaYSeguraParaPruebas1234567890!
jwt.expiration-ms=86400000
