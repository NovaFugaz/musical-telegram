services:
  postgres:
    image: postgres:16
    container_name: bexai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bexai
      POSTGRES_PASSWORD: bexai123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bexai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: